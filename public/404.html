<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Frequency Not Found | Muzac</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        background-color: #07080f;
        background-image: 
          radial-gradient(circle at 20% 20%, rgba(139, 92, 246, 0.15) 0%, transparent 40%),
          radial-gradient(circle at 80% 80%, rgba(6, 182, 212, 0.12) 0%, transparent 40%);
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", 'Segoe UI', Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
      }
      .card {
        max-width: 480px;
        width: 100%;
        background: rgba(18, 20, 32, 0.75);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-top: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 32px;
        padding: 48px 36px;
        backdrop-filter: blur(28px);
        -webkit-backdrop-filter: blur(28px);
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.8), inset 1px 1px 2px rgba(255, 255, 255, 0.15);
      }
      .logo-icon {
        width: 56px;
        height: 56px;
        margin: 0 auto 20px auto;
        display: block;
      }
      .code {
        font-size: 72px;
        font-weight: 900;
        letter-spacing: -2px;
        line-height: 1;
        margin-bottom: 12px;
        background: linear-gradient(135deg, #ffffff 0%, #c4b5fd 40%, #38bdf8 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      h1 {
        font-size: 22px;
        margin: 0 0 10px 0;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      p {
        font-size: 14px;
        color: #94a3b8;
        line-height: 1.6;
        margin: 0 0 32px 0;
      }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 14px 28px;
        background: #ffffff;
        color: #07080f;
        border-radius: 9999px;
        font-weight: 800;
        font-size: 13px;
        text-decoration: none;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), background 0.2s ease;
      }
      a:hover {
        background: #f1f5f9;
        transform: translateY(-2px) scale(1.02);
      }
      a:active {
        transform: scale(0.97);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/favicon.svg" alt="Muzac Logo" class="logo-icon" />
      <div class="code">404</div>
      <h1>Out of Audio Frequency</h1>
      <p>The song, artist, playlist, or page you were seeking is beyond our sonic spectrum or has moved.</p>
      <a href="/">Return to Muzac Player</a>
    </div>
  </body>
</html>
