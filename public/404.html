<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Track Not Found | Muzac</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        background-color: #07080c;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
      }
      .card {
        max-width: 480px;
        width: 100%;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 28px;
        padding: 48px 32px;
        backdrop-filter: blur(20px);
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
      }
      .code {
        font-size: 80px;
        font-weight: 900;
        letter-spacing: -2px;
        line-height: 1;
        margin-bottom: 12px;
        background: linear-gradient(135deg, #ffffff 0%, #6b7280 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      h1 {
        font-size: 22px;
        margin: 0 0 12px 0;
        font-weight: 700;
      }
      p {
        font-size: 14px;
        color: #9ca3af;
        line-height: 1.6;
        margin: 0 0 32px 0;
      }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 14px 28px;
        background: #ffffff;
        color: #07080c;
        border-radius: 18px;
        font-weight: 600;
        font-size: 14px;
        text-decoration: none;
        transition: transform 0.15s ease, background 0.15s ease;
      }
      a:hover {
        background: #e5e7eb;
        transform: scale(1.02);
      }
      a:active {
        transform: scale(0.98);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="code">404</div>
      <h1>Out of Audio Frequency</h1>
      <p>The track, playlist, or page you were looking for could not be found or has moved.</p>
      <a href="/">Return to Muzac Player</a>
    </div>
  </body>
</html>
