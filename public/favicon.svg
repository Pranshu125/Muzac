<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="muzacBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#191b2a"/>
      <stop offset="50%" stop-color="#0f111d"/>
      <stop offset="100%" stop-color="#070810"/>
    </linearGradient>
    <linearGradient id="muzacEdge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="40%" stop-color="#a78bfa" stop-opacity="0.4"/>
      <stop offset="80%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="muzacWave" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#c4b5fd"/>
      <stop offset="70%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="muzacGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="18" fill="url(#muzacBg)" stroke="url(#muzacEdge)" stroke-width="1.5"/>

  <!-- Minimalist "M" Soundwave Continuum -->
  <g filter="url(#muzacGlow)">
    <!-- Bar 1 (Left Stave) -->
    <rect x="13.5" y="21" width="5" height="22" rx="2.5" fill="url(#muzacWave)" opacity="0.85"/>
    <!-- Bar 2 (Left Peak) -->
    <rect x="22.5" y="14" width="5" height="36" rx="2.5" fill="url(#muzacWave)"/>
    <!-- Bar 3 (Center Valley / Harmonic Node) -->
    <rect x="31.5" y="24" width="5" height="22" rx="2.5" fill="url(#muzacWave)" opacity="0.9"/>
    <!-- Bar 4 (Right Peak) -->
    <rect x="40.5" y="14" width="5" height="36" rx="2.5" fill="url(#muzacWave)"/>
    <!-- Bar 5 (Right Stave) -->
    <rect x="49.5" y="21" width="5" height="22" rx="2.5" fill="url(#muzacWave)" opacity="0.85"/>
    
    <!-- Floating Spatial Spark Node -->
    <circle cx="34" cy="17" r="2.5" fill="#38bdf8"/>
  </g>
</svg>
