<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="ogBg" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#16182a"/>
      <stop offset="50%" stop-color="#0c0e18"/>
      <stop offset="100%" stop-color="#06070e"/>
    </radialGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="mLogoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#c4b5fd"/>
      <stop offset="70%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="25" stdDeviation="35" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#ogBg)"/>

  <!-- Ambient Sonic Glowing Orbs -->
  <circle cx="250" cy="120" r="320" fill="#8b5cf6" fill-opacity="0.14" filter="blur(90px)"/>
  <circle cx="950" cy="460" r="340" fill="#06b6d4" fill-opacity="0.12" filter="blur(100px)"/>

  <!-- Central Glassmorphic Card -->
  <rect x="130" y="70" width="940" height="490" rx="40" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2" filter="url(#shadow)"/>

  <!-- Logo Pill with Soundwave "M" -->
  <g transform="translate(200, 130)">
    <!-- Squircle Icon Tile -->
    <rect x="0" y="0" width="60" height="60" rx="18" fill="#131524" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5"/>
    <g transform="translate(6, 6) scale(0.75)">
      <rect x="13.5" y="21" width="5" height="22" rx="2.5" fill="url(#mLogoGrad)"/>
      <rect x="22.5" y="14" width="5" height="36" rx="2.5" fill="url(#mLogoGrad)"/>
      <rect x="31.5" y="24" width="5" height="22" rx="2.5" fill="url(#mLogoGrad)"/>
      <rect x="40.5" y="14" width="5" height="36" rx="2.5" fill="url(#mLogoGrad)"/>
      <rect x="49.5" y="21" width="5" height="22" rx="2.5" fill="url(#mLogoGrad)"/>
      <circle cx="34" cy="17" r="2.5" fill="#38bdf8"/>
    </g>
    
    <text x="80" y="38" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="28" font-weight="900" fill="#ffffff" letter-spacing="1">MUZAC</text>
    <rect x="195" y="18" width="95" height="26" rx="13" fill="#8b5cf6" fill-opacity="0.2" stroke="#8b5cf6" stroke-opacity="0.4"/>
    <text x="242" y="35" font-family="monospace" font-size="11" font-weight="700" fill="#c4b5fd" text-anchor="middle">HI-FI MASTER</text>
  </g>

  <!-- Main Headline -->
  <text x="200" y="275" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="64" font-weight="900" fill="url(#accentGrad)" letter-spacing="-1.5">Liquid Glass &amp; Claymorphism</text>
  
  <text x="200" y="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="600" fill="#e2e8f0">Next-Generation Hi-Fi Music Streaming Engine</text>

  <text x="200" y="380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" fill="#94a3b8">
    Spotify • Apple Music • YouTube Music • 24-bit Lossless ALAC • Spatial Audio • Real-time Lyrics
  </text>

  <!-- Dynamic Equalizer Visualizer -->
  <g transform="translate(800, 260)">
    <rect x="0" y="55" width="10" height="65" rx="5" fill="#8b5cf6" fill-opacity="0.4"/>
    <rect x="20" y="25" width="10" height="95" rx="5" fill="#a855f7" fill-opacity="0.7"/>
    <rect x="40" y="10" width="10" height="110" rx="5" fill="#c084fc"/>
    <rect x="60" y="35" width="10" height="85" rx="5" fill="#38bdf8" fill-opacity="0.8"/>
    <rect x="80" y="0" width="10" height="120" rx="5" fill="#ffffff"/>
    <rect x="100" y="20" width="10" height="100" rx="5" fill="#22d3ee" fill-opacity="0.8"/>
    <rect x="120" y="50" width="10" height="70" rx="5" fill="#06b6d4" fill-opacity="0.6"/>
    <rect x="140" y="70" width="10" height="50" rx="5" fill="#0ea5e9" fill-opacity="0.3"/>
  </g>

  <!-- Bottom Feature Pills -->
  <g transform="translate(200, 445)">
    <rect x="0" y="0" width="170" height="42" rx="14" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="85" y="26" font-family="sans-serif" font-size="13" font-weight="700" fill="#e2e8f0" text-anchor="middle">Spotify Connect</text>

    <rect x="185" y="0" width="170" height="42" rx="14" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="270" y="26" font-family="sans-serif" font-size="13" font-weight="700" fill="#e2e8f0" text-anchor="middle">Apple Spatial Audio</text>

    <rect x="370" y="0" width="180" height="42" rx="14" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="460" y="26" font-family="sans-serif" font-size="13" font-weight="700" fill="#e2e8f0" text-anchor="middle">YouTube Trending</text>

    <rect x="565" y="0" width="180" height="42" rx="14" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="655" y="26" font-family="sans-serif" font-size="13" font-weight="700" fill="#e2e8f0" text-anchor="middle">24-bit/192kHz Studio</text>
  </g>
</svg>
