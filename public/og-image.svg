<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1f2430" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#0e1118" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#07080c" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#9ca3af"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGlow)"/>

  <!-- Subtle ambient circles -->
  <circle cx="200" cy="150" r="280" fill="#ffffff" fill-opacity="0.03" filter="blur(80px)"/>
  <circle cx="1000" cy="480" r="320" fill="#ffffff" fill-opacity="0.02" filter="blur(90px)"/>

  <!-- Central Glassmorphic Card -->
  <rect x="150" y="80" width="900" height="470" rx="36" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2" filter="url(#shadow)"/>

  <!-- Logo Pill -->
  <rect x="220" y="145" width="180" height="42" rx="21" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15"/>
  <circle cx="245" cy="166" r="6" fill="#10b981"/>
  <text x="262" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#e5e7eb" letter-spacing="1">LOSSLESS HI-FI</text>

  <!-- Main Headline -->
  <text x="220" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="76" font-weight="900" fill="url(#accentGrad)" letter-spacing="-2">Muzac</text>
  
  <text x="220" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="500" fill="#9ca3af">Liquid Glass &amp; Claymorphism Music Player</text>

  <text x="220" y="375" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="400" fill="#6b7280">
    Unified Spotify, Apple Music &amp; YouTube Music • 24-bit Audio • Synced Lyrics
  </text>

  <!-- Soundwave Equalizer Visualization -->
  <g transform="translate(730, 220)">
    <rect x="0" y="60" width="10" height="60" rx="5" fill="#ffffff" fill-opacity="0.25"/>
    <rect x="20" y="30" width="10" height="90" rx="5" fill="#ffffff" fill-opacity="0.5"/>
    <rect x="40" y="10" width="10" height="110" rx="5" fill="#ffffff" fill-opacity="0.8"/>
    <rect x="60" y="40" width="10" height="80" rx="5" fill="#ffffff" fill-opacity="0.6"/>
    <rect x="80" y="0" width="10" height="120" rx="5" fill="#ffffff" fill-opacity="1"/>
    <rect x="100" y="25" width="10" height="95" rx="5" fill="#ffffff" fill-opacity="0.75"/>
    <rect x="120" y="55" width="10" height="65" rx="5" fill="#ffffff" fill-opacity="0.4"/>
    <rect x="140" y="70" width="10" height="50" rx="5" fill="#ffffff" fill-opacity="0.2"/>
  </g>

  <!-- Bottom Badges -->
  <g transform="translate(220, 440)">
    <rect x="0" y="0" width="155" height="40" rx="12" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="77" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e5e7eb" text-anchor="middle">Apple Music City</text>

    <rect x="170" y="0" width="155" height="40" rx="12" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="247" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e5e7eb" text-anchor="middle">Spotify Curated</text>

    <rect x="340" y="0" width="155" height="40" rx="12" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="417" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e5e7eb" text-anchor="middle">Offline Downloads</text>
  </g>
</svg>
