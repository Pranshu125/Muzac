<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Muzac" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#07080c" />
    <title>Muzac — Liquid Glass Hi-Fi Music Player</title>
    <meta name="description" content="Ultimate Liquid Glass & Claymorphism Music Player combining Spotify, YouTube Music, Apple Music with lossless audio, synced lyrics, and offline download hub" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(err => {
            console.log('ServiceWorker registration omitted:', err);
          });
        });
      }
    </script>
  </body>
</html>
