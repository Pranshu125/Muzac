<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Muzac" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#07080c" />
    <title>Muzac — Liquid Glass Hi-Fi Music Player</title>
    <meta name="description" content="Ultimate Liquid Glass & Claymorphism Music Player combining Spotify, YouTube Music, Apple Music with lossless audio, synced lyrics, and offline download hub." />
    <meta name="keywords" content="muzac, music player, liquid glass, claymorphism, hi-fi audio, lossless, apple music city charts, spotify playlists, synced lyrics, offline music" />
    <meta name="author" content="Muzac Audio Technologies" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://muzac.vercel.app/" />

    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://muzac.vercel.app/" />
    <meta property="og:title" content="Muzac — Liquid Glass Hi-Fi Music Player" />
    <meta property="og:description" content="Lossless audio streaming, synced lyrics, and unified music discovery across Spotify, Apple Music, and YouTube." />
    <meta property="og:image" content="https://muzac.vercel.app/og-image.svg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="Muzac" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://muzac.vercel.app/" />
    <meta name="twitter:title" content="Muzac — Liquid Glass Hi-Fi Music Player" />
    <meta name="twitter:description" content="Lossless audio streaming, synced lyrics, and unified music discovery across Spotify, Apple Music, and YouTube." />
    <meta name="twitter:image" content="https://muzac.vercel.app/og-image.svg" />

    <!-- Google Site Verification (Search Console) -->
    <meta name="google-site-verification" content="muzac-search-console-verification" />

    <!-- Schema.org Organization & WebApplication JSON-LD -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://muzac.vercel.app/#website",
            "url": "https://muzac.vercel.app/",
            "name": "Muzac",
            "description": "Liquid Glass Hi-Fi Music Player combining Spotify, YouTube Music, and Apple Music",
            "potentialAction": {
              "@type": "SearchAction",
              "target": "https://muzac.vercel.app/?q={search_term_string}",
              "query-input": "required name=search_term_string"
            }
          },
          {
            "@type": "WebApplication",
            "@id": "https://muzac.vercel.app/#app",
            "name": "Muzac",
            "url": "https://muzac.vercel.app/",
            "applicationCategory": "MultimediaApplication",
            "operatingSystem": "All",
            "browserRequirements": "Requires JavaScript. Requires HTML5.",
            "offers": {
              "@type": "Offer",
              "price": "0",
              "priceCurrency": "USD"
            }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            reg.update();
            reg.onupdatefound = () => {
              const installing = reg.installing;
              if (installing) {
                installing.onstatechange = () => {
                  if (installing.state === 'installed' && navigator.serviceWorker.controller) {
                    installing.postMessage({ type: 'SKIP_WAITING' });
                  }
                };
              }
            };
          }).catch(err => {
            console.log('ServiceWorker registration omitted:', err);
          });
        });
      }
    </script>
  </body>
</html>
